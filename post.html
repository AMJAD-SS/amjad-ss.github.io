<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-W58S7W5R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الإعلان - منصة متكاملون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-blue: #1565ff; --primary-dark: #0d1117; --light-bg: #f4f6fa; --white: #ffffff; --text-color: #1a1a1a; --muted-text: #6b7280; --border-color: #e5e9f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-color); line-height: 1.8; }
        .main-nav { background-color: var(--primary-dark); }
        .nav-inner { max-width: 1100px; margin: auto; display: flex; overflow-x: auto; }
        .nav-inner a { color: #e5e7eb; padding: 14px 20px; font-size: 15px; font-weight: 600; white-space: nowrap; text-decoration: none; }
        .nav-inner a:hover { background-color: var(--primary-blue); }
        .single-wrapper { max-width: 800px; margin: 40px auto; padding: 0 15px; }
        .post-box { background: var(--white); border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; }
        .post-img { width: 100%; height: 240px; background: var(--white); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; padding: 25px; }
        .post-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .apply-btn { display: block; text-align: center; background: var(--primary-blue); color: var(--white); padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; text-decoration: none; margin-top: 25px; transition: background 0.2s; }
        .apply-btn:hover { background: #0a3fa8; color: var(--white); }
    </style>
</head>
<body>

    <nav class="main-nav">
        <div class="nav-inner">
            <a href="index.html">الرئيسية</a>
            <a href="job-un.html?cat=aid">المساعدات</a>
            <a href="job-un.html?cat=jobs">الوظائف</a>
            <a href="job-un.html?cat=grads">الخريجين</a>
            <a href="job-un.html?cat=economy">الاقتصاد</a>
            <a href="job-un.html?cat=education">التعليم</a>
            <a href="job-un.html?cat=health">الصحة</a>
        </div>
    </nav>

    <div class="single-wrapper">
        <div id="single-post-container"></div>
        <div class="mt-4">
            <a href="index.html" style="color: var(--primary-dark); text-decoration: none; font-weight: bold;"><i class="fas fa-arrow-right ms-1"></i> العودة للرئيسية</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = parseInt(urlParams.get('id'));

        fetch('jobs.json')
            .then(res => res.json())
            .then(data => {
                const job = data.find(item => item.id === postId);
                const container = document.getElementById('single-post-container');

                if (!job) {
                    container.innerHTML = '<div class="alert alert-warning text-center">عذراً، لم يتم العثور على الإعلان المطلوب.</div>';
                    return;
                }

                document.title = job.title + " - منصة متكاملون";

                container.innerHTML = `
                    <article class="post-box">
                        <div class="post-img">
                            <img src="${job.image || 'logo.png'}" alt="${job.title}">
                        </div>
                        <div class="p-4 p-md-5">
                            <h1 style="color: var(--primary-dark); font-size: 24px; font-weight: 800; margin-bottom: 15px;">${job.title}</h1>
                            <div style="font-size: 14px; color: var(--muted-text); display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                                <span><i class="far fa-building text-primary ms-1"></i> الجهة: ${job.company}</span>
                                <span><i class="far fa-calendar-alt text-primary ms-1"></i> التاريخ: ${job.date}</span>
                            </div>
                            <div style="font-size: 17px; color: #2d3748; line-height: 1.9; text-align: justify;">
                                <p>${job.details}</p>
                            </div>
                            <a href="${job.link}" class="apply-btn" target="_blank">
                                <i class="fas fa-paper-plane ms-2"></i> اضغط هنا للانتقال إلى رابط التسجيل المباشر
                            </a>
                        </div>
                    </article>
                `;
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
